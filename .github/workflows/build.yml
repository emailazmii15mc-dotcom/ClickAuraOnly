
name: Build ClickAura Only

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Extract source
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name build.gradle

      - name: Build JAR
        run: |
          cd "$(find project -name build.gradle -printf '%h\n' | head -n 1)"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ClickAuraOnly-Fabric-1.20.1
          path: project/**/build/libs/*.jar
          
